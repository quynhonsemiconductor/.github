# =============================================================================
# Security · Scan — committed-secret gate.
#
# This repo is org-wide config/docs (community health defaults, CODEOWNERS
# template, profile README) — no app code or IaC, so the shared quynhonsemiconductor/ci
# security suite (Semgrep/Trivy, app-oriented) and Checkov (Terraform-oriented)
# don't apply. Gitleaks alone still matters: this repo is public, so a
# committed secret here is exposed org-wide immediately.
#
# actions-security (zizmor) matters MORE here than most repos: this repo is
# PUBLIC, so a vulnerable workflow pattern is visible to anyone, not just the
# org. Blocking — the initial rollout ran clean, no findings.
# =============================================================================
name: Security · Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1" # weekly Monday 04:00 UTC

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: quynhonsemiconductor/ci/actions/scan-secrets@v1

  actions-security:
    permissions:
      contents: read
      security-events: write
    uses: quynhonsemiconductor/ci/.github/workflows/actions-security.yml@v1
    with:
      blocking: true
